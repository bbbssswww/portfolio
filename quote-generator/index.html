<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报价单生成器 | AutoDev</title>
<meta name="description" content="自动化开发服务报价单生成器 - 快速生成专业报价单">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;color:#1e293b;background:#f1f5f9;line-height:1.5;-webkit-font-smoothing:antialiased}
input,textarea,select,button{font-family:inherit;font-size:inherit}
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;--gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-300:#cbd5e1;--gray-400:#94a3b8;--gray-500:#64748b;--gray-600:#475569;--gray-700:#334155;--radius:8px;--max-w:900px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--shadow-lg:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.04)}
.container{max-width:var(--max-w);margin:0 auto;padding:0 20px}
/* Nav */
.nav{background:#0f172a;color:#fff;padding:14px 0;position:sticky;top:0;z-index:100}
.nav-inner{display:flex;align-items:center;justify-content:space-between}
.nav-brand{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.nav-brand svg{width:20px;height:20px}
.nav-back{color:var(--gray-400);font-size:.85rem;text-decoration:none;display:flex;align-items:center;gap:4px;transition:color .2s}
.nav-back:hover{color:#fff}
/* Toolbar */
.toolbar{background:#fff;border-bottom:1px solid var(--gray-200);padding:12px 0;position:sticky;top:54px;z-index:99}
.toolbar-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.toolbar-left{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--gray-500)}
.toolbar-left .status-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block}
.toolbar-right{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:6px;font-weight:600;font-size:.82rem;cursor:pointer;border:none;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 2px 8px rgba(37,99,235,.3)}
.btn-outline{background:#fff;color:var(--gray-600);border:1px solid var(--gray-300)}
.btn-outline:hover{background:var(--gray-50);border-color:var(--gray-400)}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-sm{padding:6px 12px;font-size:.78rem}
/* Quote Paper */
.quote-paper{background:#fff;border-radius:10px;box-shadow:var(--shadow-lg);margin:24px auto;padding:48px 56px;max-width:var(--max-w)}
.quote-header{display:flex;justify-content:space-between;margin-bottom:36px;padding-bottom:24px;border-bottom:2px solid var(--gray-200)}
.quote-from h2{font-size:1.3rem;font-weight:800;margin-bottom:4px}
.quote-from p{font-size:.82rem;color:var(--gray-500);line-height:1.7}
.quote-meta{text-align:right}
.quote-meta .label{font-size:.75rem;color:var(--gray-400);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.quote-meta .value{font-size:1rem;font-weight:600}
.quote-meta .value.small{font-size:.85rem;font-weight:400;color:var(--gray-500)}
/* Client & Info Row */
.info-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
.info-field label{display:block;font-size:.78rem;font-weight:600;color:var(--gray-500);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.info-field input,.info-field textarea{width:100%;padding:10px 12px;border:1px solid var(--gray-200);border-radius:6px;font-size:.9rem;outline:none;transition:border-color .2s;background:var(--gray-50)}
.info-field input:focus,.info-field textarea:focus{border-color:var(--primary);background:#fff}
.info-field textarea{min-height:52px;resize:vertical}
/* Items Table */
.items-table{width:100%;border-collapse:collapse;margin-bottom:24px}
.items-table th{padding:10px 12px;font-size:.75rem;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.4px;text-align:left;border-bottom:2px solid var(--gray-200);background:var(--gray-50)}
.items-table th:last-child,.items-table td:last-child{text-align:center;width:36px}
.items-table th:nth-child(3),.items-table td:nth-child(3){text-align:center;width:80px}
.items-table th:nth-child(4),.items-table td:nth-child(4){text-align:right;width:100px}
.items-table th:nth-child(5),.items-table td:nth-child(5){text-align:right;width:110px}
.items-table td{padding:6px 12px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
.items-table .item-desc{width:100%;min-width:160px}
.items-table .item-desc input{width:100%;padding:8px 10px;border:1px solid transparent;border-radius:4px;font-size:.88rem;outline:none;background:transparent;transition:all .2s}
.items-table .item-desc input:focus{border-color:var(--primary);background:var(--primary-light)}
.items-table .item-qty input{width:60px;padding:8px 8px;border:1px solid transparent;border-radius:4px;font-size:.88rem;text-align:center;outline:none;background:transparent;transition:all .2s}
.items-table .item-qty input:focus{border-color:var(--primary);background:var(--primary-light)}
.items-table .item-price input{width:90px;padding:8px 8px;border:1px solid transparent;border-radius:4px;font-size:.88rem;text-align:right;outline:none;background:transparent;transition:all .2s}
.items-table .item-price input:focus{border-color:var(--primary);background:var(--primary-light)}
.items-table .item-total{font-weight:600;font-size:.9rem;padding-right:12px;color:var(--gray-700)}
.items-table .item-del{padding:4px}
.items-table .item-del button{width:28px;height:28px;border-radius:6px;border:none;background:transparent;color:var(--gray-400);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.items-table .item-del button:hover{background:#fef2f2;color:#ef4444}
/* Add item button */
.add-item-btn{display:flex;align-items:center;gap:6px;padding:10px 16px;background:var(--gray-50);border:1px dashed var(--gray-300);border-radius:6px;color:var(--gray-500);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;margin-bottom:24px;width:fit-content}
.add-item-btn:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
/* Totals */
.totals{margin-left:auto;width:300px}
.totals-row{display:flex;justify-content:space-between;padding:8px 0;font-size:.9rem}
.totals-row.total{font-size:1.15rem;font-weight:800;border-top:2px solid var(--gray-200);padding-top:12px;margin-top:4px;color:var(--primary)}
.totals-row .amount{font-weight:600}
.totals-row .amount.currency{font-weight:400;font-size:.8rem;color:var(--gray-400)}
.tax-row{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:6px 0;font-size:.85rem;color:var(--gray-500)}
.tax-row input{width:60px;padding:4px 8px;border:1px solid var(--gray-200);border-radius:4px;text-align:center;font-size:.85rem;outline:none}
.tax-row input:focus{border-color:var(--primary)}
/* Notes */
.notes-section{margin-top:28px;padding-top:20px;border-top:1px solid var(--gray-200)}
.notes-section label{display:block;font-size:.78rem;font-weight:600;color:var(--gray-500);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.notes-section textarea{width:100%;padding:12px;border:1px solid var(--gray-200);border-radius:6px;font-size:.88rem;min-height:70px;resize:vertical;outline:none;transition:border-color .2s}
.notes-section textarea:focus{border-color:var(--primary)}
/* Footer */
.quote-footer{text-align:center;margin-top:32px;padding-top:16px;border-top:1px solid var(--gray-200);font-size:.75rem;color:var(--gray-400)}
/* Saved Quotes */
.saved-section{max-width:var(--max-w);margin:0 auto 24px;padding:0 20px}
.saved-section h3{font-size:.85rem;font-weight:700;color:var(--gray-500);margin-bottom:8px;text-transform:uppercase;letter-spacing:.3px}
.saved-list{display:flex;flex-wrap:wrap;gap:8px}
.saved-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--gray-200);border-radius:6px;padding:8px 14px;font-size:.82rem;cursor:pointer;transition:all .2s}
.saved-item:hover{border-color:var(--primary);background:var(--primary-light)}
.saved-item .saved-name{font-weight:600;color:var(--gray-700)}
.saved-item .saved-date{font-size:.72rem;color:var(--gray-400)}
.saved-item .saved-del{background:none;border:none;color:var(--gray-400);cursor:pointer;padding:2px;border-radius:3px;transition:all .2s;margin-left:4px}
.saved-item .saved-del:hover{color:#ef4444;background:#fef2f2}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#0f172a;color:#fff;padding:12px 24px;border-radius:8px;font-size:.85rem;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.2);opacity:0;transition:all .4s;z-index:999;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Print Styles */
@media print{
.nav,.toolbar,.saved-section,.add-item-btn,.item-del,.toast{display:none!important}
.quote-paper{box-shadow:none;margin:0;padding:32px 40px;border-radius:0}
.info-field input,.info-field textarea,.items-table input,.items-table .item-desc input,.items-table .item-qty input,.items-table .item-price input,.notes-section textarea{border-color:transparent!important;background:transparent!important;padding:4px 0}
.items-table td{padding:6px 4px}
.quote-header{border-bottom-color:#000!important}
.totals-row.total{border-top-color:#000!important}
body{background:#fff}
}
@media(max-width:700px){
.quote-paper{padding:24px 20px;margin:16px auto}
.quote-header{flex-direction:column;gap:16px}
.quote-meta{text-align:left}
.info-row{grid-template-columns:1fr}
.items-table{font-size:.82rem}
.items-table .item-desc{min-width:100px}
.items-table .item-price input{width:70px}
.toolbar-inner{flex-direction:column;align-items:flex-start}
.totals{width:100%}
}
</style>
</head>
<body>
<nav class="nav">
<div class="container nav-inner">
<a href="https://bbbssswww.github.io/portfolio" class="nav-brand">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
AutoDev
</a>
<a href="https://bbbssswww.github.io/portfolio" class="nav-back">&larr; 返回作品集</a>
</div>
</nav>
<div class="toolbar">
<div class="container toolbar-inner">
<div class="toolbar-left">
<span class="status-dot"></span>
<span>自动保存中</span>
<span style="color:var(--gray-300)">|</span>
<span id="quoteNumDisplay">报价单 #<span id="quoteNumHeader">001</span></span>
</div>
<div class="toolbar-right">
<button class="btn btn-outline btn-sm" onclick="newQuote()">新报价单</button>
<button class="btn btn-outline btn-sm" onclick="saveQuote()">保存</button>
<button class="btn btn-primary btn-sm" onclick="window.print()">
<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
打印 / 导出 PDF
</button>
</div>
</div>
</div>
<div class="saved-section" id="savedSection">
<h3>已保存的报价单</h3>
<div class="saved-list" id="savedList"></div>
</div>
<div class="quote-paper" id="quotePaper">
<div class="quote-header">
<div class="quote-from">
<h2 contenteditable="true" id="companyName">AutoDev</h2>
<p contenteditable="true" id="companyInfo">自动化解决方案<br>33965842bsw@gmail.com</p>
</div>
<div class="quote-meta">
<div class="label">报价单编号</div>
<div class="value" id="quoteNum">001</div>
<div class="label" style="margin-top:10px">日期</div>
<div class="value small"><input type="date" id="quoteDate" style="border:none;background:transparent;font-size:.85rem;outline:none;cursor:text;color:var(--gray-500);text-align:right;width:130px"></div>
</div>
</div>
<div class="info-row">
<div class="info-field">
<label>客户名称</label>
<input type="text" id="clientName" placeholder="输入客户名称 / 公司名">
</div>
<div class="info-field">
<label>客户联系方式</label>
<input type="text" id="clientContact" placeholder="邮箱、微信或电话">
</div>
</div>
<table class="items-table" id="itemsTable">
<thead>
<tr>
<th style="width:auto">服务项目</th>
<th style="width:60px;text-align:center">数量</th>
<th style="width:100px;text-align:right">单价 (¥)</th>
<th style="width:110px;text-align:right">小计 (¥)</th>
<th style="width:36px"></th>
</tr>
</thead>
<tbody id="itemsBody"></tbody>
</table>
<button class="add-item-btn" onclick="addItem()">
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
添加服务项
</button>
<div class="totals">
<div class="tax-row">
<label>税率 (%)</label>
<input type="number" id="taxRate" value="0" min="0" max="100" step="1" oninput="calcTotals()">
</div>
<div class="totals-row"><span>小计</span><span class="amount" id="subtotal">¥0.00</span></div>
<div class="totals-row"><span>税额</span><span class="amount" id="taxAmount">¥0.00</span></div>
<div class="totals-row total"><span>总计</span><span class="amount" id="total">¥0.00</span></div>
</div>
<div class="notes-section">
<label>备注 / 条款</label>
<textarea id="notes" placeholder="付款方式、交付周期、售后条款等…"></textarea>
<div style="font-size:.78rem;color:var(--gray-400);margin-top:6px">以上价格仅供参考，最终以沟通确认为准</div>
</div>
<div class="quote-footer">
AutoDev &mdash; 自动化解决方案 &bull; 33965842bsw@gmail.com
</div>
</div>
<div class="toast" id="toast"></div>
<script>
// State
let items = [];
let savedQuotes = JSON.parse(localStorage.getItem('quotes') || '[]');
let currentId = localStorage.getItem('currentQuoteId') || '001';
let autoSaveTimer = null;

// Init
function init() {
document.getElementById('quoteDate').value = new Date().toISOString().split('T')[0];
loadQuote(currentId);
renderSavedList();
setupAutoSave();
}

// Items
function addItem(desc, qty, price) {
const id = Date.now() + Math.random();
items.push({ id, desc: desc || '', qty: qty || 1, price: price || 0 });
renderItems();
calcTotals();
}
function removeItem(id) {
items = items.filter(i => i.id !== id);
renderItems();
calcTotals();
}
function renderItems() {
const tbody = document.getElementById('itemsBody');
tbody.innerHTML = '';
if (items.length === 0) {
const tr = document.createElement('tr');
tr.innerHTML = '<td colspan="5" style="text-align:center;padding:28px;color:var(--gray-400);font-size:.85rem">点击下方"添加服务项"开始构建报价</td>';
tbody.appendChild(tr);
return;
}
items.forEach((item, idx) => {
const total = item.qty * item.price;
const tr = document.createElement('tr');
tr.innerHTML = `
<td class="item-desc"><input type="text" value="${escHtml(item.desc)}" placeholder="例如：数据采集脚本开发" oninput="updateItem(${idx},'desc',this.value)" onfocus="this.select()"></td>
<td class="item-qty" style="text-align:center"><input type="number" value="${item.qty}" min="0.01" step="1" oninput="updateItem(${idx},'qty',parseFloat(this.value)||0)" onfocus="this.select()"></td>
<td class="item-price"><input type="number" value="${item.price}" min="0" step="10" oninput="updateItem(${idx},'price',parseFloat(this.value)||0)" onfocus="this.select()"></td>
<td class="item-total" style="text-align:right">¥${total.toFixed(2)}</td>
<td class="item-del"><button onclick="removeItem(${item.id})" title="删除">✕</button></td>
`;
tbody.appendChild(tr);
});
}
function updateItem(idx, field, val) {
if (idx >= 0 && idx < items.length) {
items[idx][field] = val;
calcTotals();
renderItems();
}
}
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

// Calc
function calcTotals() {
const sub = items.reduce((s, i) => s + (i.qty || 0) * (i.price || 0), 0);
const rate = parseFloat(document.getElementById('taxRate').value) || 0;
const tax = sub * rate / 100;
const total = sub + tax;
document.getElementById('subtotal').textContent = '¥' + sub.toFixed(2);
document.getElementById('taxAmount').textContent = '¥' + tax.toFixed(2);
document.getElementById('total').textContent = '¥' + total.toFixed(2);
}

// Save / Load
function saveQuote() {
const data = {
id: currentId,
companyName: document.getElementById('companyName').textContent,
companyInfo: document.getElementById('companyInfo').textContent,
date: document.getElementById('quoteDate').value,
clientName: document.getElementById('clientName').value,
clientContact: document.getElementById('clientContact').value,
items: JSON.parse(JSON.stringify(items)),
taxRate: document.getElementById('taxRate').value,
notes: document.getElementById('notes').value,
savedAt: new Date().toISOString()
};
const idx = savedQuotes.findIndex(q => q.id === currentId);
if (idx >= 0) savedQuotes[idx] = data;
else savedQuotes.push(data);
localStorage.setItem('quotes', JSON.stringify(savedQuotes));
renderSavedList();
showToast('报价单已保存');
}
function loadQuote(id) {
const data = savedQuotes.find(q => q.id === id);
currentId = id || '001';
localStorage.setItem('currentQuoteId', currentId);
if (data) {
document.getElementById('companyName').textContent = data.companyName || 'AutoDev';
document.getElementById('companyInfo').textContent = data.companyInfo || '自动化解决方案';
document.getElementById('quoteDate').value = data.date || new Date().toISOString().split('T')[0];
document.getElementById('clientName').value = data.clientName || '';
document.getElementById('clientContact').value = data.clientContact || '';
items = data.items || [];
document.getElementById('taxRate').value = data.taxRate || 0;
document.getElementById('notes').value = data.notes || '';
} else {
document.getElementById('companyName').textContent = 'AutoDev';
document.getElementById('companyInfo').textContent = '自动化解决方案\n33965842bsw@gmail.com';
document.getElementById('clientName').value = '';
document.getElementById('clientContact').value = '';
items = [];
document.getElementById('taxRate').value = '0';
document.getElementById('notes').value = '';
}
document.getElementById('quoteNum').textContent = currentId;
document.getElementById('quoteNumHeader').textContent = currentId;
renderItems();
calcTotals();
}
function newQuote() {
const maxNum = savedQuotes.reduce((m, q) => Math.max(m, parseInt(q.id) || 0), 0);
const newId = String(maxNum + 1).padStart(3, '0');
currentId = newId;
localStorage.setItem('currentQuoteId', currentId);
items = [];
document.getElementById('clientName').value = '';
document.getElementById('clientContact').value = '';
document.getElementById('taxRate').value = '0';
document.getElementById('notes').value = '';
document.getElementById('quoteDate').value = new Date().toISOString().split('T')[0];
document.getElementById('quoteNum').textContent = currentId;
document.getElementById('quoteNumHeader').textContent = currentId;
renderItems();
calcTotals();
showToast('新报价单已创建');
}
function deleteQuote(id, e) {
e.stopPropagation();
if (!confirm('确定删除此报价单？')) return;
savedQuotes = savedQuotes.filter(q => q.id !== id);
localStorage.setItem('quotes', JSON.stringify(savedQuotes));
if (currentId === id) loadQuote(savedQuotes.length > 0 ? savedQuotes[0].id : '001');
renderSavedList();
showToast('已删除');
}
function renderSavedList() {
const container = document.getElementById('savedList');
if (savedQuotes.length === 0) {
container.innerHTML = '<div style="font-size:.82rem;color:var(--gray-400);padding:4px 0">暂无保存的报价单</div>';
return;
}
container.innerHTML = '';
savedQuotes.forEach(q => {
const div = document.createElement('div');
div.className = 'saved-item' + (q.id === currentId ? ' saved-item-active' : '');
const date = q.savedAt ? new Date(q.savedAt).toLocaleDateString('zh-CN') : '';
const name = q.clientName || '未命名';
div.onclick = () => loadQuote(q.id);
div.innerHTML = `
<span class="saved-name">#${q.id} ${escHtml(name)}</span>
<span class="saved-date">${date}</span>
<button class="saved-del" onclick="deleteQuote('${q.id}',event)" title="删除">✕</button>
`;
container.appendChild(div);
});
}
function setupAutoSave() {
document.querySelectorAll('input, textarea, [contenteditable]').forEach(el => {
el.addEventListener('input', () => {
clearTimeout(autoSaveTimer);
autoSaveTimer = setTimeout(saveQuote, 2000);
});
});
}
function showToast(msg) {
const t = document.getElementById('toast');
t.textContent = msg;
t.classList.add('show');
setTimeout(() => t.classList.remove('show'), 2500);
}
// Start
init();
</script>
</body>
</html>
